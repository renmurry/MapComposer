# MapComposer visual themes. Every map can be drawn in any theme.
# Colours are hex; fonts are bundled (resources/fonts) so output looks the same on every PC.
# Copy a block, give it a new key and name to make your own theme.

classic:
  name: Classic
  description: Navy title bar, white panels, black frame - the standard office look.
  font: Work Sans
  title_style: bar          # bar | plain | left | block
  page_bg: "#ffffff"
  frame: "#222222"
  frame_double: true
  panel_bg: "#ffffff"
  panel_edge: "#222222"
  boxed: true
  title_bar: "#1f3b57"
  title_text: "#ffffff"
  heading: "#222222"
  text: "#111111"
  muted: "#4a4a4a"
  accent: "#1f3b57"
  map_bg_plain: "#f7f7f4"
  map_bg_image: "#ebebeb"
  map_edge: "#111111"
  grid_plain: "#8a8a8a"
  grid_image: "#ffffff"
  admin_edge_plain: "#4a4a4a"
  soft: ["#fbb4ae", "#b3cde3", "#ccebc5", "#decbe4", "#fed9a6", "#ffffcc", "#e5d8bd", "#fddaec", "#b3e2cd", "#fdcdac", "#cbd5e8", "#f4cae4", "#e6f5c9", "#fff2ae", "#f1e2cc"]
  label_plain: "#222222"
  label_halo_plain: "#ffffff"
  loc_fill: "#eeeeee"
  loc_edge: "#9a9a9a"
  loc_hl: "#fff2b3"
  contour_plain: "#a0522d"
  ramp: ["#ffffcc", "#c2e699", "#78c679", "#31a354", "#006837"]
  boundary: "#ff2020"
  north: "#111111"

